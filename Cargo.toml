[package]
name = "bbcli"
version = "2026.9.6"
edition = "2021"
description = "CLI for a Bytebase server (Connect protocol) with OAuth2 auto-refresh, for CLI agents like Claude Code"
license = "Apache-2.0"
publish = false

[[bin]]
name = "bbcli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fd-lock = "4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# Only used for the SIGPIPE reset in main, which is Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
